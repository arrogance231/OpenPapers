services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openpapers
      POSTGRES_USER: openpapers
      POSTGRES_PASSWORD: openpapers-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpapers -d openpapers"]
      interval: 5s
      timeout: 5s
      retries: 20

  openpapers:
    build: .
    environment:
      GROBID_URL: http://grobid:8070
      RESEARCH_DB_PATH: /app/data/research.sqlite
      MCP_TRANSPORT: http
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8787
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      grobid:
        condition: service_healthy
    volumes:
      - openpapers-data:/app/data

  grobid:
    image: grobid/grobid:0.9.1-full
    init: true
    ulimits:
      core: 0
    ports:
      - "8070:8070"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  openpapers-data:

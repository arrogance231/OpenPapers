services:
  openpapers:
    build: .
    environment:
      GROBID_URL: http://grobid:8070
      RESEARCH_DB_PATH: /app/data/research.sqlite
    ports:
      - "8787:8787"
    depends_on:
      grobid:
        condition: service_healthy
    volumes:
      - openpapers-data:/app/data

  grobid:
    image: grobid/grobid:0.9.1-full
    init: true
    ulimits:
      core: 0
    ports:
      - "8070:8070"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  openpapers-data:
